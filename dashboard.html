<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <h1>Child Welfare Health Management Platform</h1>

    <h2>Dashboard</h2>

    <div class="cards">

        <div class="card">
            <h3>Add Child</h3>
            <p>Add new child information.</p>
            <button onclick="location.href='addChild.html'">Open</button>
        </div>

        <div class="card">
            <h3>View Children</h3>
            <p>View all child records.</p>
            <button onclick="location.href='viewChildren.html'">Open</button>
        </div>

        <div class="card">
            <h3>Health Records</h3>
            <p>Manage medical records.</p>
            <button onclick="location.href='healthRecords.html'">Open</button>
        </div>

        <div class="card">
            <h3>Search Child</h3>
            <p>Search child details.</p>
            <button onclick="location.href='search.html'">Open</button>
        </div>

        <div class="card">
            <h3>Reports</h3>
            <p>View reports.</p>
            <button onclick="location.href='reports.html'">Open</button>
        </div>

        <div class="card">
            <h3>Logout</h3>
            <p>Exit the application.</p>
            <button onclick="logout()">Logout</button>
        </div>

    </div>

</div>

<script>
if(localStorage.getItem("loggedIn") !== "true"){
    window.location.href="index.html";
}

function logout(){
    localStorage.removeItem("loggedIn");
    window.location.href="index.html";
}
</script>

</body>
</html>
