<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Child Record</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">

    <h1>Child Welfare Health Management Platform</h1>
    <h2>Add Child Record</h2>

    <form id="childForm">

        <label for="name">Child Name</label>
        <input type="text" id="name" placeholder="Enter Child Name" required>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" required>

        <label for="gender">Gender</label>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <label for="guardian">Guardian Name</label>
        <input type="text" id="guardian" placeholder="Enter Guardian Name" required>

        <label for="height">Height (cm)</label>
        <input type="number" id="height" placeholder="Enter Height" required>

        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" placeholder="Enter Weight" required>

        <label for="temperature">Temperature (°C)</label>
        <input type="number" step="0.1" id="temperature" placeholder="Enter Temperature" required>

        <label for="bp">Blood Pressure</label>
        <input type="text" id="bp" placeholder="120/80" required>

        <label for="pulse">Pulse Rate</label>
        <input type="number" id="pulse" placeholder="Enter Pulse Rate" required>

        <label for="spo2">SPO₂ (%)</label>
        <input type="number" id="spo2" placeholder="Enter SPO₂" required>

        <label for="complaint">Complaint</label>
        <textarea id="complaint" rows="3" placeholder="Enter Complaint"></textarea>

        <label for="prescription">Prescription</label>
        <textarea id="prescription" rows="3" placeholder="Enter Prescription"></textarea>

        <br><br>

        <button type="submit">Save Record</button>
        <button type="button" onclick="window.location.href='dashboard.html'">
            Back to Dashboard
        </button>

    </form>

</div>

<script src="app.js"></script>

</body>
</html>
